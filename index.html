<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WM Biomechanics MVP</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
    type="module"
    crossorigin="anonymous">
  </script>

  <style>
    #cameraContainer {
      position: relative;
      width: 100%;
      max-width: 720px;
    }

    #camera {
      width: 100%;
      height: auto;
      display: block;
    }

    #overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <h1>WM Biomechanics Screening</h1>
  <h2>Mini Squat Analyzer</h2>

  <button id="startCamera">Start Camera</button>
  <button id="startTracking">Start Pose Tracking</button>

  <br><br>

  <div id="cameraContainer">

    <video
      id="camera"
      autoplay
      playsinline>
    </video>

    <canvas id="overlay"></canvas>

  </div>

  <p id="status">Status: waiting</p>

  <script type="module" src="script.js"></script>

</body>

</html>
