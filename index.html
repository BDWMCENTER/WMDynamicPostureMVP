<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WM Biomechanics MVP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.5;
    }

    button {
      padding: 10px 16px;
      margin-right: 8px;
      margin-bottom: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #cameraContainer {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin-top: 16px;
    }

    #camera {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #measurementBox {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-width: 500px;
    }

    .measurementItem {
      margin: 10px 0;
      font-size: 18px;
    }

    #status {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>WM Biomechanics Screening</h1>
  <h2>Mini Squat Analyzer</h2>
  <p>MVP v0.1</p>

  <hr>

  <button id="startCamera">Start Camera</button>
  <button id="startTracking">Start Pose Tracking</button>

  <div id="cameraContainer">

    <video
      id="camera"
      autoplay
      playsinline>
    </video>

    <canvas id="overlay"></canvas>

  </div>

  <p id="status">Status: waiting</p>

  <div id="measurementBox">

    <h3>Movement Measurement</h3>

    <div class="measurementItem">
      Left Knee Flexion:
      <strong id="leftKnee">--°</strong>
    </div>

    <div class="measurementItem">
      Right Knee Flexion:
      <strong id="rightKnee">--°</strong>
    </div>

    <div class="measurementItem">
      Trunk Lean:
      <strong id="trunkLean">--°</strong>
    </div>

    <div class="measurementItem">
      L-R Knee Difference:
      <strong id="kneeDifference">--°</strong>
    </div>

  </div>

  <script type="module" src="script.js"></script>

</body>

</html>
